[build-system]
requires = ["setuptools==68.2.2", "wheel==0.41.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dgvlm-equitable-glioma"
version = "1.0.0"
requires-python = "==3.10.*"
dependencies = [
  "torch==2.1.2",
  "torchvision==0.16.2",
  "numpy==1.26.2",
  "scipy==1.11.4",
  "scikit-learn==1.3.2",
  "pandas==2.1.4",
  "omegaconf==2.3.0",
  "hydra-core==1.3.2",
  "openslide-python==1.3.1",
  "opencv-python-headless==4.8.1.78",
  "Pillow==10.1.0",
  "h5py==3.10.0",
  "lifelines==0.27.8",
  "tqdm==4.66.1"
]

[project.scripts]
dgvlm-train = "dgvlm_equitable_glioma.commands.train:main"
dgvlm-evaluate = "dgvlm_equitable_glioma.commands.evaluate:main"
dgvlm-prepare = "dgvlm_equitable_glioma.commands.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["dgvlm_equitable_glioma"]
mypy_path = "src"

